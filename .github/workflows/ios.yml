name: iOS

on:
  push:
    branches: [main]
    paths: ['workout-tracker/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['workout-tracker/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  simulator-build:
    # willchan/tools is public, so macos-* GitHub-hosted runners are free
    # with no minute cap — this verifies the native Xcode project (including
    # the widget extension, once added) compiles, with no signing and no
    # Apple Developer account required.
    #
    # macos-latest (rather than pinning e.g. macos-15) because
    # capacitor-live-activity's Swift source references iOS 26 ActivityKit
    # APIs (ActivityState.pending, the scheduled-activity Activity.request
    # overload) unconditionally, even though this app only calls
    # startActivity/updateActivity/endActivity — so the runner's Xcode needs
    # to ship the iOS 26 SDK regardless of which app-level APIs are used.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workout-tracker

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Xcode version and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iOS Simulator
        working-directory: workout-tracker/ios/App
        run: |
          xcodebuild build \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # The steps above build for the *generic* Simulator destination purely
      # to verify the project compiles — Xcode resolves that without booting
      # any concrete device. Actually running the app needs a real simulator
      # instance, built below against that instance's id so the binary is
      # guaranteed runnable on it (no signing needed either: the Simulator
      # never enforces code signing/entitlements the way a physical device
      # does).
      - name: Boot an iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable) | .udid
          ' | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::No available iOS simulator runtime found on this runner"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build and install on the Simulator
        working-directory: workout-tracker/ios/App
        run: |
          xcodebuild build \
            -scheme App \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl install "${{ steps.sim.outputs.udid }}" \
            "build/Build/Products/Debug-iphonesimulator/App.app"

      # Minimal native smoke test: launch the installed app and confirm the
      # WKWebView actually loaded and executed our bundle inside the native
      # shell (as opposed to just compiling). src/main.ts logs a distinctive
      # marker via console.log once init() completes; Capacitor's iOS bridge
      # forwards WKWebView console.* calls to plain Swift.print() (see
      # CAPLog.swift) — i.e. real stdout, not os_log, so `log stream` (the
      # unified logging daemon) never sees it, confirmed by an earlier CI
      # run where `log stream` captured plenty of *other* App-process
      # activity but never our marker. `simctl launch --console-pty` does
      # relay real stdout, but relays it through simctl's own stdout, which
      # (being redirected to a plain file, not a real terminal) can
      # fully-buffer and only flush on process exit — an earlier attempt hit
      # exactly that, non-deterministically. `script` allocates a real pty
      # for the whole `simctl launch` invocation so its output is written to
      # our file as it streams, sidestepping that buffering.
      #
      # The wait is split into two phases with independent wall-clock
      # deadlines. A single shared budget covering both is what failed on
      # main: `simctl launch` took 25s just to get the app running on a
      # loaded runner, so the WKWebView's first navigation was left with
      # only the ~20s remainder and got killed mid-load — the app itself was
      # healthy, and the same commit passed on its PR run where the launch
      # took 5s. Both phases are dominated by how contended the runner is,
      # not by anything this repo controls, so they get generous budgets;
      # the happy path still finishes in seconds and exits as soon as the
      # marker shows up.
      - name: "Smoke test: app launches and the web bundle runs"
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          LOG: /tmp/app_console.log
        run: |
          set +e
          : > "$LOG"

          script -q "$LOG" \
            xcrun simctl launch --console-pty "$UDID" \
            com.willchan.workouttracker &
          LAUNCH_PID=$!

          # wait_for <pattern> <timeout-seconds>; also gives up early if the
          # capture process itself is gone, since simctl stays attached for
          # as long as the app is running — if it exited, the app crashed or
          # was terminated and no further output is coming.
          wait_for() {
            local deadline=$((SECONDS + $2))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if grep -q "$1" "$LOG" 2>/dev/null; then
                return 0
              fi
              if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then
                return 1
              fi
              sleep 1
            done
            return 1
          }

          # Phase 1: simctl reports the app as running ("<bundle id>: <pid>").
          wait_for "com.willchan.workouttracker: [0-9]" 180
          LAUNCHED=$?

          # Phase 2: the WKWebView loaded and ran our bundle — src/main.ts
          # logs the marker once init() completes (including seedDefaults()'s
          # initial IndexedDB write).
          FOUND=1
          if [ "$LAUNCHED" = "0" ]; then
            wait_for "WORKOUT_TRACKER_APP_READY" 180
            FOUND=$?
          fi

          kill "$LAUNCH_PID" 2>/dev/null
          pkill -f "simctl launch --console-pty" 2>/dev/null
          xcrun simctl terminate "$UDID" com.willchan.workouttracker 2>/dev/null

          echo "--- app console output ---"
          cat "$LOG"
          echo "--- end app console output ---"

          if [ "$LAUNCHED" != "0" ]; then
            echo "::error::simctl never reported the app as launched within 180s — the app failed to start on the Simulator."
            exit 1
          fi
          if [ "$FOUND" != "0" ]; then
            echo "::error::App launched but the marker never appeared within 180s — the WKWebView failed to load or run the web bundle."
            exit 1
          fi
          echo "Smoke test passed: app launched and the web bundle ran inside the native shell."
