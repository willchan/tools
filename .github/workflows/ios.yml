name: iOS

on:
  push:
    branches: [main]
    paths: ['workout-tracker/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['workout-tracker/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  simulator-build:
    # willchan/tools is public, so macos-* GitHub-hosted runners are free
    # with no minute cap — this verifies the native Xcode project (including
    # the widget extension, once added) compiles, with no signing and no
    # Apple Developer account required.
    #
    # macos-latest (rather than pinning e.g. macos-15) because
    # capacitor-live-activity's Swift source references iOS 26 ActivityKit
    # APIs (ActivityState.pending, the scheduled-activity Activity.request
    # overload) unconditionally, even though this app only calls
    # startActivity/updateActivity/endActivity — so the runner's Xcode needs
    # to ship the iOS 26 SDK regardless of which app-level APIs are used.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workout-tracker
    env:
      # Every step appends "<phase>\t<seconds>" here; the final step renders
      # them into the run's job summary. Step-level durations are already in
      # the Actions UI — this exists for the sub-step phases that aren't
      # (Simulator boot wait vs. app launch vs. WKWebView load), which is
      # where this job's wall time actually varies run to run.
      TIMINGS: /tmp/ios-timings.tsv
      APP_ID: com.willchan.workouttracker
      APP_PATH: build/Build/Products/Debug-iphonesimulator/App.app
      # Written only when the smoke test fails, uploaded as an artifact.
      DIAG: /tmp/ios-diagnostics

    steps:
      - uses: actions/checkout@v4

      # Kick the Simulator boot off first and don't wait for it: `simctl boot`
      # returns as soon as the boot is under way, so the ~1-3min it takes to
      # come up overlaps the Xcode build below instead of adding to it. The
      # matching `bootstatus -b` wait runs just before the app is installed.
      #
      # Overlapping also buys the device a long settle window. `bootstatus -b`
      # returns once SpringBoard is up, but first-boot background work
      # (installd, keychain, dyld closure priming) keeps running after that,
      # and the app's first launch competes with it — the one run where the
      # first launch stalled was also the run with the shortest gap between
      # boot and launch, though at n=1 that's a hypothesis, not a conclusion.
      - name: Start booting an iOS Simulator
        id: sim
        run: |
          t0=$SECONDS
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable) | .udid
          ' | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::No available iOS simulator runtime found on this runner"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          printf 'simulator boot (start, async)\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          t0=$SECONDS
          bun install
          printf 'bun install\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      - name: Build web bundle
        run: |
          t0=$SECONDS
          bun run build
          printf 'web bundle build\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      - name: Sync Capacitor iOS project
        run: |
          t0=$SECONDS
          npx cap sync ios
          printf 'cap sync ios\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      - name: Xcode version and SDKs
        id: xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # The build compiles seven SPM packages from source (Capacitor core plus
      # the six plugins in CapApp-SPM/Package.swift), which dominates it.
      # Caching DerivedData — SourcePackages checkouts, module cache and all —
      # keeps that off the critical path when only app sources changed. Keyed
      # on the Xcode version because a toolchain change invalidates the module
      # cache, and on the manifests that determine which packages get built.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: workout-tracker/ios/App/build
          key: ios-deriveddata-${{ steps.xcode.outputs.version }}-${{ hashFiles('workout-tracker/bun.lock', 'workout-tracker/ios/App/CapApp-SPM/Package.swift', 'workout-tracker/ios/App/App.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-deriveddata-${{ steps.xcode.outputs.version }}-

      # One build, not two. This used to build twice — once for
      # `generic/platform=iOS Simulator` to prove it compiles, then again for
      # the booted device's id into a different -derivedDataPath, which shares
      # nothing with the first and so recompiled everything from scratch (1.5
      # to 2.5min of pure duplicate work). The generic destination produces
      # the same Debug-iphonesimulator product, and `simctl install` takes it
      # on any device of that runtime — so the single generic build both
      # proves the project compiles and yields the .app that gets installed.
      # Building for the generic destination also keeps this step independent
      # of the boot started above, which is what lets the two overlap.
      - name: Build for the Simulator
        working-directory: workout-tracker/ios/App
        run: |
          t0=$SECONDS
          # Drop the previous run's product before building. Compiled objects
          # and package checkouts restored from cache are what make this fast
          # and are safe to reuse; a cached .app is not, since a stale one
          # would let the smoke test pass against an old web bundle. Deleting
          # it only forces the link and resource-copy phases to rerun.
          rm -rf "$APP_PATH"
          xcodebuild build \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          printf 'xcodebuild\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      - name: Wait for the Simulator to finish booting
        run: |
          t0=$SECONDS
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          printf 'simulator boot (wait, after build)\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      # AppLogic is a standalone local Swift package (ios/App/AppLogic), not
      # a target inside App.xcodeproj — xcodebuild can build/test a bare
      # Package.swift directly, using the product's name as the scheme, with
      # no Xcode project/workspace involved. This is where native logic
      # extracted out of the thin App/LiveActivityWidget targets gets real
      # XCTest coverage; see ios/MANUAL_SETUP.md for why those targets
      # themselves have no unit test target of their own.
      - name: Run AppLogic unit tests
        working-directory: workout-tracker/ios/App/AppLogic
        run: |
          t0=$SECONDS
          xcodebuild test \
            -scheme AppLogic \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation
          printf 'AppLogic xctest\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      - name: Install on the Simulator
        working-directory: workout-tracker/ios/App
        run: |
          t0=$SECONDS
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"
          printf 'simctl install\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      # A cold first launch pays one-time costs the smoke test shouldn't be
      # measuring: dyld closure generation, faulting in the app binary and its
      # frameworks, and starting WKWebView's three helper processes for the
      # first time on this device. Burn those here so the assertion below is
      # timing a warm launch. Failures are ignored on purpose — this step
      # exists to warm caches, and the smoke test is what decides pass/fail.
      #
      # Note this leaves the app's IndexedDB already seeded, so the measured
      # launch no longer covers seedDefaults()'s cold path; the Playwright E2E
      # suite covers that on every run with a fresh browser context.
      - name: Pre-warm the app
        run: |
          t0=$SECONDS
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$APP_ID" || true
          sleep 10
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" "$APP_ID" || true
          printf 'app pre-warm launch\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

      # Minimal native smoke test: launch the installed app and confirm the
      # WKWebView actually loaded and executed our bundle inside the native
      # shell (as opposed to just compiling). src/main.ts logs a distinctive
      # marker via console.log once init() completes; Capacitor's iOS bridge
      # forwards WKWebView console.* calls to plain Swift.print() (see
      # CAPLog.swift) — i.e. real stdout, not os_log, so `log stream` (the
      # unified logging daemon) never sees it, confirmed by an earlier CI
      # run where `log stream` captured plenty of *other* App-process
      # activity but never our marker. `simctl launch --console-pty` does
      # relay real stdout, but relays it through simctl's own stdout, which
      # (being redirected to a plain file, not a real terminal) can
      # fully-buffer and only flush on process exit — an earlier attempt hit
      # exactly that, non-deterministically. `script` allocates a real pty
      # for the whole `simctl launch` invocation so its output is written to
      # our file as it streams, sidestepping that buffering.
      #
      # `script -t 0` on top of that, because the pty alone was not enough:
      # an instrumented run had the app up 3s into the step (per the app's own
      # log timestamps) while the entire console — pid line, "WebView loaded"
      # and marker together — only reached our file 31s later, in one flush.
      # -t sets the flush interval, and 0 flushes every I/O event. That
      # buffering is very likely what the original failure actually hit: the
      # marker may have been produced on time and still not been in the file
      # when the capture was killed.
      #
      # The wait is split into two phases with independent wall-clock
      # deadlines, and each phase's duration is recorded. A single shared
      # budget covering both is what failed on main: the app took 25s to
      # report as launched, leaving the WKWebView's first navigation only the
      # ~20s remainder before it got killed mid-load. The app was healthy —
      # the same commit passed on its PR run. Neither phase tracks how fast
      # the runner is (the failing run had the fastest build steps of any run
      # to date), so both get budgets far above anything yet observed.
      #
      # Phase 1 polls the Simulator's launchd rather than the captured
      # console, so "is the app running" stays a fact about the process and
      # cannot be distorted by however the capture happens to buffer — which
      # is what made the earlier launch timings unusable for optimization.
      - name: "Smoke test: app launches and the web bundle runs"
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          LOG: /tmp/app_console.log
        run: |
          set +e
          : > "$LOG"

          # -t 0 is BSD script's flush interval. Probe rather than assume:
          # if this runner image ships a script(1) without it, capture still
          # works, just with the buffering described above.
          if script -t 0 -q /dev/null true >/dev/null 2>&1; then
            SCRIPT=(script -t 0 -q "$LOG")
          else
            echo "::warning::script(1) has no -t flag here; console capture may buffer"
            SCRIPT=(script -q "$LOG")
          fi

          "${SCRIPT[@]}" xcrun simctl launch --console-pty "$UDID" "$APP_ID" &
          LAUNCH_PID=$!

          # wait_until <predicate> <timeout-seconds> <poll-seconds>; also
          # gives up early if the capture process itself is gone, since simctl
          # stays attached for as long as the app is running — if it exited,
          # the app crashed or was terminated and nothing more is coming.
          wait_until() {
            local deadline=$((SECONDS + $2))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if "$1"; then
                return 0
              fi
              if ! kill -0 "$LAUNCH_PID" 2>/dev/null; then
                return 1
              fi
              sleep "$3"
            done
            return 1
          }

          app_running() {
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null \
              | grep -q "UIKitApplication:$APP_ID"
          }
          marker_logged() {
            grep -q "WORKOUT_TRACKER_APP_READY" "$LOG" 2>/dev/null
          }

          # Phase 1: the app process is running, per the Simulator's launchd.
          t0=$SECONDS
          wait_until app_running 180 2
          LAUNCHED=$?
          printf 'app launch (process running)\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"

          # Phase 2: the WKWebView loaded and ran our bundle — src/main.ts
          # logs the marker once init() completes.
          FOUND=1
          if [ "$LAUNCHED" = "0" ]; then
            t0=$SECONDS
            wait_until marker_logged 180 1
            FOUND=$?
            printf 'webview load + marker capture\t%s\n' "$((SECONDS - t0))" >> "$TIMINGS"
          fi

          # Failure-only evidence, gathered before the app is killed so it
          # describes the broken state rather than the cleaned-up one. The
          # screenshot tells a blank WKWebView apart from a rendered UI or a
          # crash dialog at a glance. The Simulator's unified log is where a
          # WebContent process crash shows up — the one failure mode the
          # Capacitor console cannot report, because a dead WebContent prints
          # nothing at all, which is indistinguishable from a slow load in
          # the console alone. The next step uploads all of it as an artifact.
          if [ "$LAUNCHED" != "0" ] || [ "$FOUND" != "0" ]; then
            mkdir -p "$DIAG"
            xcrun simctl io "$UDID" screenshot "$DIAG/simulator.png" 2>&1 | tail -3
            xcrun simctl spawn "$UDID" log show \
              --predicate 'process == "App" OR process CONTAINS "WebKit"' \
              --last 5m --style compact > "$DIAG/simulator-log.txt" 2>&1
            cp "$LOG" "$DIAG/app_console.log" 2>/dev/null
            cp ~/Library/Logs/DiagnosticReports/App*.ips "$DIAG/" 2>/dev/null
            cp ~/Library/Logs/DiagnosticReports/*WebContent*.ips "$DIAG/" 2>/dev/null
            echo "Diagnostics written to $DIAG:"
            ls -la "$DIAG"
          fi

          kill "$LAUNCH_PID" 2>/dev/null
          pkill -f "simctl launch --console-pty" 2>/dev/null
          xcrun simctl terminate "$UDID" "$APP_ID" 2>/dev/null

          echo "--- app console output ---"
          cat "$LOG"
          echo "--- end app console output ---"

          # Capacitor prints each of these natively, in this order, before our
          # marker can appear. On a failure the last one reached says which
          # layer broke: no "WebView loaded" means the webview never finished
          # its first navigation (environment/WebKit), while "WebView loaded"
          # without "To Native" means it loaded and our bundle did not run
          # (our bug). Distinguishing those took a second CI round-trip the
          # last time this failed.
          if [ "$LAUNCHED" != "0" ] || [ "$FOUND" != "0" ]; then
            echo "--- native milestones ---"
            while IFS='|' read -r pattern label; do
              if grep -q "$pattern" "$LOG" 2>/dev/null; then
                echo "  reached: $label"
              else
                echo "  MISSING: $label"
              fi
            done <<'MILESTONES'
          Loading app at capacitor://localhost|WKWebView started loading the bundle
          WebView loaded|WKWebView finished its first navigation
          To Native ->|our JS ran and called through the Capacitor bridge
          WORKOUT_TRACKER_APP_READY|init() completed (the marker)
          MILESTONES
            echo "--- end native milestones ---"
          fi

          if [ "$LAUNCHED" != "0" ]; then
            echo "::error::simctl never reported the app as launched within 180s — the app failed to start on the Simulator."
            exit 1
          fi
          if [ "$FOUND" != "0" ]; then
            echo "::error::App launched but the marker never appeared within 180s — see the native milestones above and the uploaded diagnostics artifact."
            exit 1
          fi
          echo "Smoke test passed: app launched and the web bundle ran inside the native shell."

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-test-diagnostics
          path: /tmp/ios-diagnostics
          if-no-files-found: ignore
          retention-days: 14

      # Runs even when something above failed: a timed-out smoke test is
      # exactly when the phase breakdown is worth reading.
      - name: Timing summary
        if: always()
        run: |
          if [ ! -s "$TIMINGS" ]; then
            echo "No timings recorded."
            exit 0
          fi
          {
            echo "### iOS job timings"
            echo
            echo "| phase | seconds |"
            echo "| --- | ---: |"
            awk -F'\t' '{ total += $2; printf "| %s | %s |\n", $1, $2 }
                        END { printf "| **measured total** | **%d** |\n", total }' "$TIMINGS"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ui-test-safe-area:
    # Ground-truth backstop for env(safe-area-inset-*) handling — see
    # workout-tracker/e2e/safe-area.spec.ts and ios/MANUAL_SETUP.md's "Test
    # coverage layers". Playwright can only prove the app's CSS *responds
    # correctly* to a mocked inset value (Chromium/WebKit never resolve
    # env(safe-area-inset-*) to anything but 0 outside a real WKWebView);
    # this job proves the compiled app running on a real notched/
    # Dynamic-Island Simulator actually *reports* a non-zero inset and the
    # header clears it.
    #
    # A separate job rather than a step in simulator-build above because it
    # needs a specific device: simulator-build's "first available iOS
    # device" pick isn't guaranteed to be notched (a runner's default
    # runtime can include non-notched models like iPhone SE), so this job
    # boots an explicitly pinned notched/Dynamic-Island model instead.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: workout-tracker

    steps:
      - uses: actions/checkout@v4

      # Preference order: newer Pro models first (guaranteed Dynamic
      # Island), falling back to older notched-but-no-Island models: any of
      # these has enough top inset to distinguish the pre-fix layout (header
      # padding-top fixed at 16px) from the fix (header padding-top also
      # claims env(safe-area-inset-top)). Errors out rather than silently
      # falling back to a non-notched device (e.g. iPhone SE), which would
      # make SafeAreaUITests pass regardless of whether the fix is present.
      - name: Boot a notched/Dynamic-Island iOS Simulator
        id: sim
        run: |
          CANDIDATES=(
            "iPhone 17 Pro Max" "iPhone 17 Pro" "iPhone 17" "iPhone Air"
            "iPhone 16 Pro Max" "iPhone 16 Pro" "iPhone 16" "iPhone 16 Plus" "iPhone 16e"
            "iPhone 15 Pro Max" "iPhone 15 Pro"
          )
          DEVICES_JSON=$(xcrun simctl list devices available -j)
          UDID=""
          NAME=""
          for candidate in "${CANDIDATES[@]}"; do
            FOUND_UDID=$(echo "$DEVICES_JSON" | jq -r --arg name "$candidate" '
              .devices | to_entries[] | select(.key | contains("iOS")) | .value[]
              | select(.name == $name) | .udid
            ' | head -1)
            if [ -n "$FOUND_UDID" ]; then
              UDID="$FOUND_UDID"
              NAME="$candidate"
              break
            fi
          done
          if [ -z "$UDID" ]; then
            echo "::error::No notched/Dynamic-Island Simulator device found among: ${CANDIDATES[*]}"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      # Same rationale as simulator-build's DerivedData cache: the build
      # compiles seven SPM packages from source, which dominates wall time.
      # A distinct path/key (rather than sharing simulator-build's) because
      # a `-scheme AppUITests` test run and a `-scheme App` build produce
      # different derived data layouts, and the two jobs run on separate
      # runners in parallel so a shared key would just race, not share.
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: workout-tracker/ios/App/build-uitest
          key: ios-deriveddata-uitest-${{ steps.xcode.outputs.version }}-${{ hashFiles('workout-tracker/bun.lock', 'workout-tracker/ios/App/CapApp-SPM/Package.swift', 'workout-tracker/ios/App/App.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-deriveddata-uitest-${{ steps.xcode.outputs.version }}-

      - name: Wait for the Simulator to finish booting
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Run AppUITests (safe-area ground truth)
        working-directory: workout-tracker/ios/App
        run: |
          # Same defensive rm as simulator-build's "Build for the Simulator"
          # step, and for the same reason: a cache-restored DerivedData is
          # safe to reuse for compiled objects and package checkouts, but
          # not for a previous run's built products — this job exists
          # specifically to catch a safe-area CSS regression, so silently
          # testing a stale App.app/test runner instead of rebuilding
          # against the current web bundle would make it an ineffective
          # ground-truth backstop.
          rm -rf build-uitest/Build/Products/Debug-iphonesimulator/App.app
          rm -rf build-uitest/Build/Products/Debug-iphonesimulator/AppUITests-Runner.app
          xcodebuild test \
            -scheme AppUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -derivedDataPath build-uitest \
            CODE_SIGNING_ALLOWED=NO
