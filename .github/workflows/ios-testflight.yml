name: iOS TestFlight

# Manual only. Unlike ios.yml's Simulator smoke test (which runs on every
# push/PR and needs no Apple account), this job signs a real archive and
# spends an App Store Connect build number + TestFlight upload slot each
# time it runs — so it's triggered by hand from the Actions tab once a
# build is ready for a device, not on every commit.
#
# Requires the repo secrets listed in ios/TESTFLIGHT_SETUP.md. Until those
# are added, this workflow will fail at the "Import signing certificate"
# step — that's expected, it just means setup isn't finished yet.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: workout-tracker
    env:
      EXPORT_METHOD: app-store

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      # A dedicated, password-protected keychain is created for this run
      # and deleted at the end (see "Clean up keychain") so the imported
      # private keys never linger on the runner past this job.
      #
      # Two certificates go in. Distribution signs what's uploaded. The
      # fixed Apple Development one is there because `xcodebuild archive`
      # with automatic signing first signs for development. With no
      # development identity in the keychain, Xcode created a brand-new
      # Apple Development certificate through the API key on every run, and
      # after enough runs the account hit Apple's certificate limit ("Your
      # account has reached the maximum number of certificates"). Importing
      # one long-lived certificate lets Xcode reuse it. Optional, so the
      # workflow still runs (and creates a certificate) without the secret.
      - name: Import signing certificates
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          DEV_CERT_P12_BASE64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=ios-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f cert.p12

          if [ -n "$DEV_CERT_P12_BASE64" ]; then
            echo "$DEV_CERT_P12_BASE64" | base64 --decode > dev-cert.p12
            security import dev-cert.p12 -k "$KEYCHAIN" -P "$DEV_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -f dev-cert.p12
          else
            echo "::warning::APPLE_DEV_CERT_P12_BASE64 not set; Xcode will create a new Apple Development certificate this run (see ios/TESTFLIGHT_SETUP.md, section 5)."
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          EXISTING=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Written once, reused by the archive, export, and upload steps below.
      # xcodebuild's -authenticationKeyPath/-authenticationKeyID/
      # -authenticationKeyIssuerID flags are Apple's supported way to give
      # automatic signing a non-interactive identity on a CI runner where no
      # Apple ID is ever logged in.
      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      # Automatic signing, not manual — the App target and the
      # LiveActivityWidgetExtension target each have their own bundle ID and
      # need their own provisioning profile. A manual PROVISIONING_PROFILE_
      # SPECIFIER override on the command line applies to every target in
      # the build, so it can't express "this profile for App, that one for
      # the widget." -allowProvisioningUpdates lets xcodebuild resolve (and
      # create, if needed) the correct profile per target itself, using the
      # API key above instead of an interactive Apple ID session — no need
      # to hand-manage a provisioning profile secret per target.
      - name: Archive
        working-directory: workout-tracker/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export .ipa
        working-directory: workout-tracker/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ env.EXPORT_METHOD }}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        working-directory: workout-tracker/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f build/ipa/App.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Group "Build Distribution" in App Store Connect is "Manual for Xcode
      # Builds" (automatic distribution only covers Xcode Cloud), so the
      # build is added to its groups via the API once processing finishes.
      - name: Add build to TestFlight groups
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          TESTFLIGHT_GROUPS: Me
        run: |
          PROPS=ios/App/build/App.xcarchive/Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleIdentifier" "$PROPS")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$PROPS")
          bun ios/scripts/assign-testflight-groups.ts "$BUNDLE_ID" "$BUILD_NUMBER"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
